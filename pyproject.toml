[project]
name = "telecom-rag-chatbot"
version = "0.1.0"
description = "RAG telecom customer-care chatbot grounded in FAQ, tickets, and PDF guides"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-chroma>=0.1.4",
    "langchain-huggingface>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.0.0",
    "streamlit>=1.36.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Flat module layout — ship the top-level modules as the package payload.
include = [
    "config.py",
    "vectorstore.py",
    "retriever.py",
    "chain.py",
    "main.py",
    "app.py",
    "ingest_faq.py",
    "ingest_tickets.py",
    "ingest_guides.py",
    "ingest_all.py",
    "ingest_plans.py",
]
